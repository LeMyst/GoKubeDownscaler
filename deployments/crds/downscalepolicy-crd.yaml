apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: downscalepolicies.downscaler.io
spec:
  group: downscaler.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              downtime:
                type: string
                description: "Timespans where workloads will be scaled down (e.g. 'Mon-Fri 19:00-08:00 UTC')"
              uptime:
                type: string
                description: "Timespans where workloads will be scaled up (e.g. 'Mon-Fri 08:00-19:00 UTC')" 
              forceDowntime:
                type: string
                description: "Timespans where workloads will be forced to scale down"
              forceUptime:
                type: string
                description: "Timespans where workloads will be forced to scale up"
              downscaleReplicas:
                type: integer
                minimum: 0
                description: "Number of replicas to scale down to"
                default: 0
              gracePeriod:
                type: string
                description: "Duration a workload must exist before being scaled (e.g. '15m')"
              exclude:
                type: string
                description: "Timespans when workload should be excluded from scaling"
              excludeUntil:
                type: string
                format: date-time
                description: "Exclude workload from scaling until this timestamp"
          status:
            type: object
            properties:
              lastScaled:
                type: string
                format: date-time
                description: "Last time the workload was scaled"
              currentReplicas:
                type: integer
                description: "Current number of replicas"
              phase:
                type: string
                enum: ["Active", "Downscaled", "Excluded"]
                description: "Current phase of the downscale policy"
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Current Replicas
      type: integer
      jsonPath: .status.currentReplicas
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: downscalepolicies
    singular: downscalepolicy
    kind: DownscalePolicy
    shortNames:
    - dsp